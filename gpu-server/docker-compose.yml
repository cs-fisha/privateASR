services:
  asr-gpu:
    build:
      context: ..
      dockerfile: gpu-server/Dockerfile
      args:
        HTTP_PROXY: ${ASR_PROXY:-}
        HTTPS_PROXY: ${ASR_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
      extra_hosts:
        - "host.docker.internal:host-gateway"
    restart: ${ASR_RESTART_POLICY:-unless-stopped}
    ports:
      - "${ASR_GPU_BIND:-127.0.0.1}:${ASR_GPU_PORT:-8080}:8080"
    environment:
      ASR_API_TOKEN: ${ASR_API_TOKEN:?set ASR_API_TOKEN}
      ASR_ENGINE: ${ASR_ENGINE:-funasr}
      ASR_MODEL: ${ASR_MODEL:-iic/SenseVoiceSmall}
      ASR_DEFAULT_LANGUAGE: ${ASR_DEFAULT_LANGUAGE:-zh}
      ASR_REMOVE_FILLERS: ${ASR_REMOVE_FILLERS:-true}
      ASR_DEVICE: ${ASR_DEVICE:-cuda}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-float16}
      ASR_FUNASR_VAD_MODEL: ${ASR_FUNASR_VAD_MODEL:-fsmn-vad}
      ASR_FUNASR_MAX_SEGMENT_MS: ${ASR_FUNASR_MAX_SEGMENT_MS:-30000}
      ASR_MAX_BYTES: ${ASR_MAX_BYTES:-26214400}
      ASR_INFERENCE_TIMEOUT: ${ASR_INFERENCE_TIMEOUT:-300}
      HTTP_PROXY: ${ASR_PROXY:-}
      HTTPS_PROXY: ${ASR_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - models:/root/.cache
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health')"]
      interval: ${ASR_HEALTH_INTERVAL:-30s}
      timeout: ${ASR_HEALTH_TIMEOUT:-5s}
      retries: ${ASR_HEALTH_RETRIES:-3}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ASR_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
volumes:
  models:
